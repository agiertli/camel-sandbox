- route:
    id: ship-order
    description: Prepare Ship Order
    from:
      uri: timer
      parameters:
        period: "5000"
        timerName: yaml
      steps:
        - to:
            id: to-6059
            uri: direct
            parameters:
              name: get-account
            disabled: false
            variableReceive: account
        - to:
            id: to-2249
            uri: direct
            parameters:
              name: get-order-sequence
            disabled: false
            variableReceive: orderSequence
        - to:
            id: to-2155
            uri: direct
            parameters:
              name: get-cart
        - step:
            id: kaoto-datamapper-f702171b
            steps:
              - to:
                  id: kaoto-datamapper-xslt-6816
                  uri: xslt-saxon:kaoto-datamapper-f702171b.xsl
                  parameters: {}
        - log:
            disabled: false
            message: ${body}
        - to:
            id: to-7198
            uri: file
            parameters:
              directoryName: orders
              fileName: order-${exchangeId}.xml
            disabled: false
- route:
    id: account
    description: Get account information
    from:
      id: from-3474
      uri: direct
      parameters:
        name: get-account
      steps:
        - to:
            id: to-1664
            uri: rest
            parameters:
              host: localhost:{{rest.api.port}}
              method: get
              path: /account
        - convertBodyTo:
            id: convertBodyTo-1914
            type: org.w3c.dom.Document
- route:
    id: sequence
    description: Get order sequence
    from:
      id: from-2229
      uri: direct
      parameters:
        name: get-order-sequence
      steps:
        - to:
            id: to-1475
            uri: rest
            parameters:
              host: localhost:{{rest.api.port}}
              method: get
              path: /sequence
        - convertBodyTo:
            id: convertBodyTo-3565
            type: java.lang.String
- route:
    id: cart
    description: Get cart
    from:
      id: from-3546
      uri: direct
      parameters:
        name: get-cart
      steps:
        - to:
            uri: rest
            parameters:
              host: localhost:{{rest.api.port}}
              method: get
              path: /cart
        - convertBodyTo:
            id: convertBodyTo-1966
            type: org.w3c.dom.Document
