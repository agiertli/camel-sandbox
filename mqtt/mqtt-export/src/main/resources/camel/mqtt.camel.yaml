- route:
    id: route-3284
    from:
      uri: kamelet:mqtt-source
      parameters:
        brokerUrl: tcp://localhost:1883
        topic: "#"
      steps:
        - choice:
            id: choice-3426
            otherwise:
              id: otherwise-3496
              steps:
                - log:
                    id: log-1465
                    message: Uncategorized message
            when:
              - id: when-3210
                description: Cart
                steps:
                  - log:
                      id: log-3060
                      description: Log1
                      message: Logging Cart
                simple:
                  expression: ${header.CamelMqttTopic} == 'audit/cart'
              - id: when-3310
                description: Sequence
                steps:
                  - log:
                      id: log-1228
                      message: Logging Sequence
                simple:
                  expression: ${header.CamelMqttTopic} == 'audit/sequence'
              - id: when-3805
                description: Account
                steps:
                  - log:
                      id: log-3988
                      message: Logging Account
                simple:
                  expression: ${header.CamelMqttTopic} == 'audit/account'
